# Check development pushes and deploy the production branch.
name: Publish
on:
  push:
    branches: [main, production]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One publish at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check_trains.mjs
      - run: node scripts/build.mjs _site
      - run: node scripts/check_locales.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
